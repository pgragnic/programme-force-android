name: APK
on:
  push:
    branches: [main]
  workflow_dispatch:
# APK debug plus publiés dans les Releases GitHub (audit de sécurité du 22 novembre 2026, point 4 ; Philippe, seul à l'avoir installé
# depuis GitHub) : ils sont signés avec keystore/debug.keystore, publique dans le dépôt, donc n'importe qui pourrait signer un faux
# APK installable par-dessus. L'APK reste disponible dans les artefacts de chaque build (captures, essais).
permissions:
  contents: read
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3 # v4
        with: { distribution: temurin, java-version: '17' }
      - uses: gradle/actions/setup-gradle@ed408507eac070d1f99cc633dbcf757c94c7933a # v4
        with: { gradle-version: '8.11.1' }
      - name: Tests de la logique
        run: gradle :app:testDebugUnitTest --stacktrace
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        if: failure()
        with: { name: tests, path: app/build/reports/tests }
      - name: Compilation
        run: gradle :app:assembleDebug --stacktrace
      - name: Renommer
        run: cp app/build/outputs/apk/debug/app-debug.apk ProgrammeForce.apk
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with: { name: ProgrammeForce, path: ProgrammeForce.apk }
