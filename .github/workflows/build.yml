name: APK
on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      publier:
        description: Publier une version installable
        type: boolean
        default: true
permissions:
  contents: write
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: '17' }
      - uses: gradle/actions/setup-gradle@v4
        with: { gradle-version: '8.11.1' }
      - name: Compilation
        run: gradle :app:assembleDebug --stacktrace
      - name: Renommer
        run: cp app/build/outputs/apk/debug/app-debug.apk ProgrammeForce.apk
      - uses: actions/upload-artifact@v4
        with: { name: ProgrammeForce, path: ProgrammeForce.apk }
      - name: Publier la version
        if: github.event_name == 'workflow_dispatch' && inputs.publier
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v0.1.${{ github.run_number }}
          name: Programme Force 0.1.${{ github.run_number }}
          body: APK à installer sur le téléphone (Paramètres → autoriser l'installation depuis le navigateur).
          files: ProgrammeForce.apk
          make_latest: true
