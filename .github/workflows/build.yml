name: APK
on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      publier:
        description: Publier une version installable
        type: boolean
        default: true
permissions:
  contents: write
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3 # v4
        with: { distribution: temurin, java-version: '17' }
      - uses: gradle/actions/setup-gradle@ed408507eac070d1f99cc633dbcf757c94c7933a # v4
        with: { gradle-version: '8.11.1' }
      - name: Tests de la logique
        run: gradle :app:testDebugUnitTest --stacktrace
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        if: failure()
        with: { name: tests, path: app/build/reports/tests }
      - name: Compilation
        run: gradle :app:assembleDebug --stacktrace
      - name: Renommer
        run: cp app/build/outputs/apk/debug/app-debug.apk ProgrammeForce.apk
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with: { name: ProgrammeForce, path: ProgrammeForce.apk }
      - name: Publier la version
        if: github.event_name == 'workflow_dispatch' && inputs.publier
        uses: softprops/action-gh-release@3bb12739c298aeb8a4eeaf626c5b8d85266b0e65 # v2
        with:
          tag_name: v0.1.${{ github.run_number }}
          name: UpRep 0.1.${{ github.run_number }}
          body: APK à installer sur le téléphone (Paramètres → autoriser l'installation depuis le navigateur).
          files: ProgrammeForce.apk
          make_latest: true
