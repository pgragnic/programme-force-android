# Nettoyage des anciens APK debug publiés dans les Releases (audit de sécurité du 22 novembre 2026, point 4 ;
# Philippe : « 1 oui » à la suppression des 66 versions v0.1.x, puis « Ok » à ce workflow).
# Lancé à la main uniquement. Supprime seulement les versions dont l'étiquette commence par v0.1. et leurs étiquettes ;
# les paquets Google Play (play-*) ne sont pas touchés. À retirer du dépôt une fois lancé.
name: Nettoyage des Releases
on:
  workflow_dispatch:
    inputs:
      confirmation:
        description: "Écrire SUPPRIMER pour effacer les versions v0.1.x (irréversible)"
        default: ""
permissions:
  contents: write
jobs:
  nettoyage:
    runs-on: ubuntu-latest
    env:
      GH_TOKEN: ${{ github.token }}
      GH_REPO: ${{ github.repository }}
      CONFIRMATION: ${{ inputs.confirmation }}
    steps:
      - name: Supprimer les versions v0.1.x
        run: |
          test "$CONFIRMATION" = "SUPPRIMER" || { echo "::error::Confirmation absente : écrire SUPPRIMER"; exit 1; }
          tags=$(gh release list --limit 500 --json tagName --jq '.[].tagName | select(startswith("v0.1."))')
          n=0
          for t in $tags; do
            gh release delete "$t" --yes --cleanup-tag && n=$((n+1))
          done
          echo "Versions supprimées : $n"
          reste=$(gh release list --limit 500 --json tagName --jq '[.[].tagName | select(startswith("v0.1."))] | length')
          echo "Versions v0.1.x restantes : $reste"
          test "$reste" -eq 0
