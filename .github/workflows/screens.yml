name: Captures d'écran (émulateur)
on:
  workflow_dispatch:
    inputs:
      poses:
        description: "Poses à capturer (séparées par des espaces)"
        default: "row1 squat calf"
permissions:
  contents: write
jobs:
  screens:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: 17 }
      - uses: gradle/actions/setup-gradle@v4
        with: { gradle-version: "8.11.1" }
      - run: gradle :app:assembleDebug
      - name: Activer KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules && sudo udevadm trigger --name-match=kvm
      - uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 30
          arch: x86_64
          target: google_apis
          emulator-options: -no-window -gpu swiftshader_indirect -no-snapshot -noaudio -no-boot-anim
          disable-animations: true
          script: bash scripts/shots.sh "${{ inputs.poses }}"
      - uses: actions/upload-artifact@v4
        if: always()
        with: { name: captures, path: shots }
      - name: Publier les captures sur la branche captures
        if: always()
        run: |
          cd shots && git init -q && git checkout -q -b captures && git add -A
          git -c user.name=ci -c user.email=ci@local commit -qm "captures ${{ github.run_number }}"
          git push -qf "https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}" captures
