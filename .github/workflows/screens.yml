name: Captures d'écran (émulateur)
on:
  workflow_dispatch:
    inputs:
      poses:
        description: "Poses à capturer (séparées par des espaces)"
        default: "row1 squat calf"
jobs:
  screens:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: 17 }
      - uses: gradle/actions/setup-gradle@v4
        with: { gradle-version: "8.9" }
      - run: gradle :app:assembleDebug
      - name: Activer KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules && sudo udevadm trigger --name-match=kvm
      - uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 30
          arch: x86_64
          target: google_apis
          emulator-options: -no-window -gpu swiftshader_indirect -no-snapshot -noaudio -no-boot-anim
          disable-animations: true
          script: |
            adb install -r app/build/outputs/apk/debug/*.apk
            mkdir -p shots
            for t in 0 1; do adb shell am start -S -n fr.pgragnic.force/.MainActivity --ei tab $t; sleep 12; adb exec-out screencap -p > shots/tab$t.png; done
            for p in ${{ inputs.poses }}; do adb shell am start -S -n fr.pgragnic.force/.MainActivity --es demo $p --ef k 0.5; sleep 10; adb exec-out screencap -p > shots/pose-$p.png; done
            adb logcat -d | grep -iE "AndroidRuntime|fr.pgragnic|GLSurface|libEGL|shader" | tail -150 > shots/logcat.txt || true
      - uses: actions/upload-artifact@v4
        if: always()
        with: { name: captures, path: shots }
