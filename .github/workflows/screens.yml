name: Captures d'écran (émulateur)
on:
  workflow_dispatch:
    inputs:
      poses:
        description: "Poses à capturer (séparées par des espaces)"
        default: "row1 squat calf"
permissions:
  contents: write
jobs:
  screens:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: 17 }
      - uses: gradle/actions/setup-gradle@v4
        with: { gradle-version: "8.9" }
      - run: gradle :app:assembleDebug
      - name: Activer KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules && sudo udevadm trigger --name-match=kvm
      - uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 30
          arch: x86_64
          target: google_apis
          emulator-options: -no-window -gpu swiftshader_indirect -no-snapshot -noaudio -no-boot-anim
          disable-animations: true
          script: |
            adb install -r app/build/outputs/apk/debug/*.apk
            mkdir -p shots
            A="adb shell am start -S -n fr.pgragnic.force/.MainActivity --ez seed true"
            adb shell pm grant fr.pgragnic.force android.permission.POST_NOTIFICATIONS || true
            adb shell am start -W -n fr.pgragnic.force/.MainActivity > shots/start.txt 2>&1; sleep 8; adb exec-out screencap -p > shots/plain.png
            for t in 0 1 2 3 4; do $A --ei tab $t; sleep 12; adb exec-out screencap -p > shots/tab$t.png; done
            for t in 0 2 3; do $A --ei tab $t --es theme light; sleep 12; adb exec-out screencap -p > shots/light$t.png; done
            $A --ei tab 3; sleep 10; adb shell input swipe 160 500 160 120 600; sleep 3; adb exec-out screencap -p > shots/tab3b.png
            adb shell input swipe 160 500 160 120 600; sleep 3; adb exec-out screencap -p > shots/tab3c.png
            $A --ei play 5; sleep 14; adb exec-out screencap -p > shots/play5.png
            adb shell cmd statusbar expand-notifications; sleep 3; adb exec-out screencap -p > shots/notif.png; adb shell cmd statusbar collapse
            $A --ei play 6; sleep 12; adb exec-out screencap -p > shots/play6.png
            for p in ${{ inputs.poses }}; do adb shell am start -S -n fr.pgragnic.force/.MainActivity --es demo $p --ef k 0.5; sleep 10; adb exec-out screencap -p > shots/pose-$p.png; done
            adb logcat -d -b crash > shots/crash.txt || true
            adb logcat -d -b all > shots/full.txt || true
            adb logcat -d | grep -iE "AndroidRuntime|fr.pgragnic|GLSurface|libEGL|shader" | tail -150 > shots/logcat.txt || true
      - uses: actions/upload-artifact@v4
        if: always()
        with: { name: captures, path: shots }
      - name: Publier les captures sur la branche captures
        if: always()
        run: |
          cd shots && git init -q && git checkout -q -b captures && git add -A
          git -c user.name=ci -c user.email=ci@local commit -qm "captures ${{ github.run_number }}"
          git push -qf "https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}" captures
